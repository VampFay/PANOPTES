[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptes-core"
version = "1.0.0"
description = "Zero-dependency Python client for the PANOPTES deterministic agent-security sidecar"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm-agents", "security", "guardrails", "deterministic", "mcp"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
test = []

[tool.setuptools]
packages = ["panoptes"]
