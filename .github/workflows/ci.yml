name: ci

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs on the same ref are cancelled — keeps the queue fast and
# the Actions bill bounded while iterating on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: panoptes-core (engine)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panoptes
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # pinned: the lockfile is generated and verified with 1.3.14 —
          # `latest` resolves to unverified toolchain minors (1.4.x) whose
          # lockfile format and dependency resolution drift.
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests (149 / 54,792 assertions)
        run: bun test
      - name: Benchmark regression (goldens + latency floor)
        run: bun run src/cli.ts bench --quick
      - name: CLI smoke (check / describe / replay)
        run: |
          bun run src/cli.ts check examples/policies/bench.json
          bun run src/cli.ts describe examples/policies/minimal.json
          bun run src/cli.ts replay examples/policies/minimal.json examples/traces/three-step.jsonl

  python-sdk:
    name: panoptes-core (Python SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: panoptes
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Sidecar + Python SDK tests
        run: |
          bun run src/cli.ts serve --policy examples/policies/bench.json --port 8787 &
          # poll /healthz instead of a blind sleep: ready when the server
          # answers, hard-fails after 30 s if it never comes up.
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/healthz; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8787/healthz || {
            echo "sidecar did not become healthy within 30 s"; exit 1;
          }
          python3 -m unittest discover -s python/tests -v

  dashboard:
    name: observatory dashboard (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Lint
        run: bunx eslint src/
      - name: Core mirror tests
        run: bun test tests/panoptes
      - name: Production build
        run: bun run build
