{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "panoptes-sidecar.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "panoptes-sidecar.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "panoptes-sidecar.name" . }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- if .Values.networkPolicy.ingressOnlyFromNamespaces }}
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ toYaml .Values.networkPolicy.ingressOnlyFromNamespaces | nindent 18 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4318
        - protocol: TCP
          port: 4317
{{- end }}
